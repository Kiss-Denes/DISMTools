[Options.QuickHelp]
DISM.Tools.Enable.Message=A DISMTools bizonyos funkciókat engedélyez vagy tilt, ha azok nem kompatibilisek a megadott DISM végrehajtható fájllal, a jelenlegi Windows-rendszerképpel vagy mindkettővel.{lbrace;}0{rbrace;}{lbrace;}0{rbrace;}Például, ha a DISMTools Windows 7 rendszerképet, Windows 7-es DISM-verziót vagy mindkettőt észlel, letiltja az AppX-csomag- és képességkiszolgálást, mert azok nem kompatibilisek azzal a platformmal és eszközkészlettel.{lbrace;}0{rbrace;}{lbrace;}0{rbrace;}A DISMTools más rendszerkép-paraméterek, például a kiadás alapján is letilthat funkciókat. Ez általában Windows PE rendszerképeknél fordul elő.
AppX.Package.Display.Message=Az AppX-csomag megjelenített nevei a csomagcsaládnevek azon része, amely nem tartalmaz csomagspecifikus részleteket, például architektúrát, verziót vagy kiadói hash-t.{lbrace;}0{rbrace;}{lbrace;}0{rbrace;}Az AppX-csomag {lbrace;}1{rbrace;}barátságos megjelenített nevei{lbrace;}1{rbrace;} azok a nevek, amelyeket a Start menüben lát. Ezek az alkalmazásidentitás-adatokból származnak a jegyzékben vagy a resources.pri beágyazott karakterláncaiból.{lbrace;}0{rbrace;}{lbrace;}0{rbrace;}Ha a DISMTools nem tudja lekérni a barátságos megjelenített nevet, az alkalmazás megjelenített nevét fogja megjeleníteni.Configure.Search.Message=Amikor a keresőmotor beállításait konfigurálja, kiválaszthatja, mennyi toleranciával rendelkezzen a DISMTools a mesterséges intelligencia (AI) funkcióival szemben egy keresőmotorban.{lbrace;}0{rbrace;}{lbrace;}0{rbrace;}{lbrace;}1{rbrace;}A lehető legtöbb AI-funkció kikapcsolása{lbrace;}1{rbrace;} lehetővé teszi olyan keresőmotorok közötti választást, amelyekben az AI-funkciók alapértelmezés szerint le vannak tiltva vagy nincsenek implementálva.{lbrace;}0{rbrace;}{lbrace;}1{rbrace;}Hadd szabályozzam a keresőmotorom AI-funkcióit{lbrace;}1{rbrace;} hozzáadja azokat a keresőmotorokat, amelyekben az AI-funkciók alapértelmezés szerint engedélyezve vannak, de URL-paraméterekkel vagy motorbeállításokkal szabályozhatók.{lbrace;}0{rbrace;}{lbrace;}1{rbrace;}A lehető legtöbb AI-funkció bekapcsolása{lbrace;}1{rbrace;} lehetővé teszi az összes elérhető keresőmotor közötti választást, beleértve az AI-alapú motorokat vagy a dedikált AI-módokat népszerűsítő motorokat.{lbrace;}0{rbrace;}{lbrace;}0{rbrace;}Általában a második lehetőség a legkiegyensúlyozottabb választás. A magánszféra-központúbb élmény érdekében kapcsolja ki ezeket a funkciókat.
Configure.Search.Message=A keresőmotor beállításainak konfigurálásakor kiválaszthatja, hogy a DISMTools mekkora toleranciát tanúsítson a keresőmotor mesterséges intelligencia (MI) funkcióival szemben.{lbrace;}0{rbrace;}{lbrace;}0{rbrace;}{lbrace;}1{rbrace;}Kapcsoljon ki annyi MI-funkciót, amennyit csak lehetséges{lbrace;}1{rbrace;} lehetővé teszi, hogy olyan keresőmotorok közül válasszon, ahol a MI-funkciók alapértelmezés szerint le vannak tiltva vagy nincsenek implementálva.{lbrace;}0{rbrace;}{lbrace;}1{rbrace;}Én szabályozom a keresőmotorom MI-funkcióit{lbrace;}1{rbrace;} hozzáadja azokat a keresőmotorokat, amelyeknél a MI-funkciók alapértelmezés szerint engedélyezve vannak, de URL-paramétereken vagy a keresőmotor beállításain keresztül vezérelhetők.{lbrace;}0{rbrace;}{lbrace;}1{rbrace;}Kapcsoljon be annyi MI-funkciót, amennyit csak lehetséges{lbrace;}1{rbrace;} lehetővé teszi, hogy az összes elérhető keresőmotor közül válasszon, beleértve a MI-alapú motorokat vagy a dedikált MI-t népszerűsítő motorokat is. módok.{lbrace;}0{rbrace;}{lbrace;}0{rbrace;}Általában a második lehetőség a legkiegyensúlyozottabb választás. Az adatvédelemre jobban összpontosító élmény érdekében kapcsold ki ezeket a funkciókat.
Bg.Procs.Allow.Message=A háttérfolyamatok lehetővé teszik a DISMTools számára, hogy információkat gyűjtsön a használt Windows-rendszerképéről, és lehetővé tegye a legtöbb feladatot. Ilyen például az operációs rendszer csomagjai és a Windows-rendszerkép funkciói.{lbrace;}0{rbrace;}{lbrace;}0{rbrace;}Ezeket a folyamatokat nemcsak a rendszerképfájl adatainak lekérésekor használjuk, hanem az online vagy offline telepítések kezelésekor is.

