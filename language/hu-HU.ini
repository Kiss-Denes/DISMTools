Cd.Rom.Drives.Message=CD-ROM-meghajtókat tartalmaz, beleértve a SCSI CD-ROM-meghajtókat is. Alapértelmezés szerint a rendszer CD-ROM-osztály-telepítője egy rendszer által szállított CD-audio-illesztőprogramot és CD-ROM-cserélő illesztőprogramot is telepít Plug and Play szűrőként.
Hard.Disk.Drives.Label=Merevlemez-meghajtókat tartalmaz. Lásd még a HDC és SCSIAdapter osztályokat.
VideoAdapters.Message=Videoadaptereket tartalmaz. Az ehhez az osztályhoz tartozó illesztőprogramok közé tartoznak a megjelenítő illesztőprogramok és a videominiport-illesztőprogramok.
Extension.Message=(Windows 10 és újabb verziók) Minden testreszabást igénylő eszközt tartalmaz. További információért lásd az Extension INF fájl használata dokumentációt.
Floppy.Disk.Drive.Label=Hajlékonylemez-meghajtó vezérlőket tartalmaz.
Floppy.Disk.Drives.Label=Hajlékonylemez-meghajtókat tartalmaz.
Includes.Hard.Message=Merevlemez-vezérlőket tartalmaz, beleértve az ATA/ATAPI vezérlőket, de nem a SCSI és RAID lemezvezérlőket.
InputDevices.Message=Interaktív bemeneti eszközöket tartalmaz, amelyeket a rendszer által szállított HID-osztály-illesztőprogram működtet. Tartalmazza az USB HID szabványnak megfelelő USB-eszközöket és a HID-miniillesztőprogramot használó nem USB-eszközöket. További információért lásd a HIDClass Device Setup Class dokumentációt. Lásd még a Keyboard vagy Mouse osztályokat.
ControlDevices.Message=Többfunkciós IEEE 1284.4 perifériaeszközök működését vezérlő eszközöket tartalmaz.
Dot.Print.Functions.Message=Dot4 nyomtatási funkciókat tartalmaz. A Dot4 nyomtatási funkció egy Dot4-eszközön lévő funkció, amely egyetlen gyermekeszközzel rendelkezik, amely a Printer eszközbeállítási osztály tagja.
Ieeedevices.Support.Message=IEC-61883 protokoll eszközosztályt támogató IEEE 1394 eszközöket tartalmaz. A 61883 összetevő tartalmazza a 61883.sys protokoll-illesztőprogramot, amely különféle audio- és videoadatfolyamokat továbbít a 1394 buszon. Ezek jelenleg standard/jó/alacsony minőségű DV, MPEG2, DSS és Audio adatfolyamokat tartalmaznak. Az IEC-61883 specifikációk határozzák meg ezeket az adatfolyamokat.
Ieeedevices.Support.Label=AVC protokoll eszközosztályt támogató IEEE 1394 eszközöket tartalmaz.
SBP2.Message=SBP2 protokoll eszközosztályt támogató IEEE 1394 eszközöket tartalmaz.
HostControllers.Message=PCI buszon csatlakoztatott 1394 gazdavezérlőket tartalmaz, de nem 1394 perifériákat. Az ehhez az osztályhoz tartozó illesztőprogramokat a rendszer szállítja.
Still.Image.Capture.Label=Állókép-rögzítő eszközöket, digitális fényképezőgépeket és szkennereket tartalmaz.
InfraredDevices.Message=Infravörös eszközöket tartalmaz. Az ehhez az osztályhoz tartozó illesztőprogramok közé tartoznak a Serial-IR és Fast-IR NDIS miniportok, de lásd még a Network Adapter osztályt más NDIS hálózati adapter miniportokhoz.
Keyboards.Message=Minden klaviatúrát tartalmaz. Azaz a (másodlagos) INF-ben is meg kell adni egy felsorolt gyermek HID billentyűzeteszközhöz.
ScsimediaChanger.Label=SCSI adathordozó-cserélő eszközöket tartalmaz.
Memory.Devices.Such.Label=Memóriaeszközöket tartalmaz, például flash memóriakártyákat.
Modem.Devices.INF.Message=Modemeszközöket tartalmaz. Az ehhez az osztályhoz tartozó eszköz INF-fájlja megadja az eszköz jellemzőit és konfigurációját, és ezt az információt a rendszerleíró adatbázisban tárolja. Az ehhez az osztályhoz tartozó eszköz INF-fájlja vezérlő nélküli modem vagy szoftvermodem eszközillesztőinek telepítésére is használható. Ezek az eszközök megosztják a funkcionalitást a modem eszköz és az eszközillesztő között. A modem INF-fájlokról és a Microsoft Windows Driver Model (WDM) modemeszközökről további információért lásd a Modem INF Files áttekintése és a WDM modem támogatás hozzáadása dokumentációt.
Display.Monitors.INF.Message=Megjelenítő monitorokat tartalmaz. Az ehhez az osztályhoz tartozó eszköz INF-fájlja nem telepít eszközillesztőt, hanem megadja az adott monitor jellemzőit, amelyeket a rendszerleíró adatbázisban tárolnak a videoadapterek illesztőprogramjai számára. (A monitorok a megjelenítő adapterek gyermekeszközeiként vannak felsorolva.)
Mouse.Devices.Message=Minden egéreszközt és más mutatóeszközt, például trackballokat tartalmaz. Azaz ezt az osztályt is meg kell adni a (másodlagos) INF-ben egy felsorolt gyermek HID egéreszközhöz.
Combo.Cards.Such.Message=Kombókártyákat tartalmaz, például PCMCIA modem- és hálózatikártya-adaptert. Az ilyen Plug and Play többfunkciós eszköz illesztőprogramja ezen osztály alatt telepítődik, és a modemet és a hálózati kártyát külön-külön sorolja fel gyermekeszközeiként.
Audio.Dvdmultimedia.Message=Audio- és DVD-multimédiás eszközöket, joystick-portokat és teljes mozgású videórögzítő eszközöket tartalmaz.
MultiportSerial.Message=Intelligens többportos soros kártyákat tartalmaz, de nem a portjaikhoz csatlakozó perifériaeszközöket. Nem tartalmaz nem intelligens (16550-es típusú) többportos soros vezérlőket vagy egyportos soros vezérlőket (lásd a Ports osztályt).
NetworkAdapter.Message=Hálózati adapter illesztőprogramjaiból áll. Ezeknek az illesztőprogramoknak vagy az NdisMRegisterMiniportDriver, vagy a NetAdapterCreate függvényt kell meghívniuk. Az NDIS-t vagy NetAdaptert nem használó illesztőprogramoknak más beállítási osztályt kell használniuk.
Includes.Network.Message=Hálózati és/vagy nyomtatási szolgáltatókat tartalmaz. A NetClient összetevők elavultak a Windows 8.1, Windows Server 2012 R2 és újabb verzióiban.
Network.Services.Such.Label=Hálózati szolgáltatásokat tartalmaz, például átirányítókat és kiszolgálókat.
NdisprotocolsCo.Message=NDIS protokollokat, CoNDIS önálló híváskezelőket és CoNDIS ügyfeleket tartalmaz, valamint a szállítási vermek magasabb szintű illesztőprogramjait.
SecureDevices.Message=Secure Socket Layer (SSL) kriptográfiai feldolgozást gyorsító eszközöket tartalmaz.
PcmciacardBus.Message=PCMCIA és CardBus gazdavezérlőket tartalmaz, de nem PCMCIA vagy CardBus perifériákat. Az ehhez az osztályhoz tartozó illesztőprogramokat a rendszer szállítja.
Serial.Parallel.Port.Message=Soros és párhuzamos porteszközöket tartalmaz. Lásd még a MultiportSerial osztályt.
Printers.Admin.Hit.Label=Nyomtatókat tartalmaz. IT-adminisztrátorként üsse meg őket egy baseballütővel.
Includes.SCSI.Message=SCSI/1394 által felsorolt nyomtatókat tartalmaz. Az ehhez az osztályhoz tartozó illesztőprogramok egy adott buszhoz biztosítanak nyomtatókommunikációt.
ProcessorTypes.Label=Processzortípusokat tartalmaz.
ScsihostBus.Message=SCSI Host Bus Adaptereket (HBA-kat), lemeztömb- és NVMe-vezérlőket tartalmaz.
Includes.Trusted.Message=Trusted Platform Module chipeket tartalmaz. A TPM egy biztonságos kriptoprocesszor, amely segít olyan műveletekben, mint a kriptográfiai kulcsok generálása, tárolása és használatának korlátozása. Minden új gyártású eszköznek alapértelmezés szerint implementálnia kell és engedélyeznie kell a TPM 2.0-t. További információért lásd a TPM Recommendations dokumentációt.
Includes.Sensor.Label=Szenzor- és helymeghatározó eszközöket tartalmaz, például GPS-eszközöket.
Smart.Card.Readers.Label=Smart card olvasókat tartalmaz.
Virtual.Child.Device.Message=Virtuális gyermekeszközt tartalmaz szoftverösszetevők beágyazásához. További információért lásd a Software Components hozzáadása INF-fájllal dokumentációt.
Storage.Disks.Label=Többsoros tárolóvermet használó tárolólemezeket tartalmaz.
Includes.Storage.Message=Tárolóköteteket tartalmaz a rendszer által szállított logikai kötetkezelő és azon osztály-illesztőprogramok által meghatározottak szerint, amelyek eszközobjektumokat hoznak létre a tárolókötetek ábrázolására, például a rendszerlemez-osztály-illesztőprogram.
HalsSystem.Message=HAL-okat, rendszerbuszokat, rendszerhidakat, a rendszer ACPI-illesztőprogramját és a rendszer kötetkezelő illesztőprogramját tartalmazza.
Tape.Drives.Including.Label=Szalagos meghajtókat tartalmaz, beleértve az összes szalagos miniosztály-illesztőprogramot.
Usbdevice.Includes.Message=USBDevice minden olyan USB-eszközt tartalmaz, amely nem tartozik más osztályba. Ez az osztály nem használatos USB gazdavezérlőkhöz és hubokhoz; ezekhez az eszközökhöz az illesztőprogramokat az operációs rendszer biztosítja, és a System-Defined Device Setup Classes Reserved for System Use dokumentációban leírt USB osztályt kell használniuk.
WindowsCeactive.Message=Windows CE ActiveSync eszközöket tartalmaz. A WCEUSBS beállítási osztály támogatja a kommunikációt egy személyi számítógép és egy Windows CE ActiveSync illesztőprogrammal kompatibilis eszköz (általában PocketPC eszközök) között USB-n keresztül.
